[project]
name = "storyforge-api"
version = "0.1.0"
description = "Grounded agile user story generation API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "langchain-core>=0.3.75,<2",
    "langchain-google-genai>=2.1.12,<5",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
